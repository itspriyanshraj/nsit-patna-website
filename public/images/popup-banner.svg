<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc0000"/>
      <stop offset="60%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip1">
      <rect x="0" y="0" width="800" height="520" rx="16"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="url(#bg)" clip-path="url(#clip1)"/>
  <!-- Decorative patterns -->
  <circle cx="680" cy="80" r="220" fill="rgba(255,255,255,0.03)"/>
  <circle cx="80" cy="450" r="160" fill="rgba(255,255,255,0.03)"/>
  <circle cx="750" cy="450" r="120" fill="rgba(255,255,255,0.02)"/>
  <!-- Decorative mandala-inspired circles -->
  <g transform="translate(620, 150)" opacity="0.06">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#fff" stroke-width="1"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#fff" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Right side - College building illustration -->
  <g transform="translate(480, 60)">
    <!-- Building -->
    <rect x="0" y="60" width="280" height="200" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="0" y="60" width="280" height="40" rx="4" fill="rgba(255,255,255,0.15)"/>
    <!-- Windows row 1 -->
    <rect x="20" y="115" width="35" height="40" rx="2" fill="rgba(255,215,0,0.2)"/>
    <rect x="65" y="115" width="35" height="40" rx="2" fill="rgba(255,215,0,0.2)"/>
    <rect x="110" y="115" width="35" height="40" rx="2" fill="rgba(255,215,0,0.2)"/>
    <rect x="155" y="115" width="35" height="40" rx="2" fill="rgba(255,215,0,0.2)"/>
    <rect x="200" y="115" width="35" height="40" rx="2" fill="rgba(255,215,0,0.2)"/>
    <rect x="245" y="115" width="25" height="40" rx="2" fill="rgba(255,215,0,0.2)"/>
    <!-- Windows row 2 -->
    <rect x="20" y="170" width="35" height="40" rx="2" fill="rgba(255,215,0,0.15)"/>
    <rect x="65" y="170" width="35" height="40" rx="2" fill="rgba(255,215,0,0.15)"/>
    <rect x="110" y="170" width="35" height="40" rx="2" fill="rgba(255,215,0,0.15)"/>
    <rect x="155" y="170" width="35" height="40" rx="2" fill="rgba(255,215,0,0.15)"/>
    <rect x="200" y="170" width="35" height="40" rx="2" fill="rgba(255,215,0,0.15)"/>
    <rect x="245" y="170" width="25" height="40" rx="2" fill="rgba(255,215,0,0.15)"/>
    <!-- Door -->
    <rect x="115" y="210" width="50" height="50" rx="25" fill="rgba(255,255,255,0.08)"/>
    <rect x="115" y="210" width="50" height="25" rx="4" fill="rgba(255,255,255,0.05)"/>
    <!-- Ground -->
    <rect x="-20" y="260" width="320" height="30" rx="2" fill="rgba(255,255,255,0.06)"/>
    <!-- Trees -->
    <g transform="translate(-5, 180)">
      <rect x="8" y="30" width="10" height="50" rx="2" fill="rgba(255,255,255,0.08)"/>
      <circle cx="13" cy="15" r="25" fill="rgba(255,255,255,0.08)"/>
    </g>
    <g transform="translate(260, 180)">
      <rect x="8" y="30" width="10" height="50" rx="2" fill="rgba(255,255,255,0.08)"/>
      <circle cx="13" cy="15" r="25" fill="rgba(255,255,255,0.08)"/>
    </g>
  </g>

  <!-- Left side - Content -->
  <!-- Badge -->
  <rect x="30" y="25" width="130" height="28" rx="14" fill="rgba(255,215,0,0.15)"/>
  <text x="95" y="44" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#ffd700" text-anchor="middle">ADMISSIONS 2026-27</text>

  <!-- Main heading -->
  <text x="30" y="100" font-family="'Segoe UI','Red Hat Display',sans-serif" font-size="38" font-weight="900" fill="#ffffff">Admission Open</text>
  <text x="30" y="148" font-family="'Segoe UI','Red Hat Display',sans-serif" font-size="38" font-weight="900" fill="#ffffff">2026-27</text>

  <!-- Courses -->
  <rect x="30" y="170" width="400" height="90" rx="8" fill="url(#cardGrad)"/>
  <text x="45" y="192" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffd700">PROGRAMS OFFERED</text>
  <text x="45" y="215" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.85)">B.Tech (CSE, ECE, ME, CE)  |  Diploma (Engg.)</text>
  <text x="45" y="238" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.85)">BBA  |  BCA  |  MBA  |  MCA</text>

  <!-- Features -->
  <text x="30" y="290" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)">✓ Approved by AICTE, New Delhi</text>
  <text x="220" y="290" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)">✓ Affiliated to AKU &amp; SBTE</text>
  <text x="30" y="310" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)">✓ NAAC Accredited</text>
  <text x="220" y="310" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)">✓ ISO 9001:2008 Certified</text>

  <!-- Contact Info -->
  <rect x="30" y="335" width="400" height="50" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="45" y="357" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">📞 9102403265  |  7781020349  |  7781020359</text>
  <text x="45" y="375" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">✉ info@nsit.in  |  🌐 www.nsit.in</text>

  <!-- CTA Button -->
  <a href="/enquiry">
    <rect x="30" y="405" width="220" height="48" rx="24" fill="url(#btn)" filter="url(#shadow)"/>
    <text x="140" y="435" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="800" fill="#1a0000" text-anchor="middle">Apply Now →</text>
  </a>

  <!-- Decorative elements -->
  <rect x="630" y="320" width="6" height="80" rx="3" fill="rgba(255,215,0,0.15)"/>
  <rect x="645" y="340" width="4" height="40" rx="2" fill="rgba(255,215,0,0.1)"/>
</svg>
