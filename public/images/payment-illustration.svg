<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c84a"/>
      <stop offset="50%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#b8912e"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Gold Card (back) -->
  <g transform="rotate(-6, 180, 115)">
    <rect x="55" y="28" width="260" height="170" rx="14" fill="url(#goldGrad)" stroke="#a88320" stroke-width="2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.15))"/>
    <rect x="55" y="28" width="260" height="85" rx="14" fill="url(#goldShine)"/>
    <!-- Chip -->
    <rect x="80" y="60" width="36" height="28" rx="4" fill="rgba(255,255,255,0.3)"/>
    <rect x="83" y="63" width="30" height="22" rx="2" fill="rgba(255,255,255,0.15)"/>
    <!-- Card number -->
    <text x="80" y="125" fill="rgba(255,255,255,0.85)" font-family="monospace" font-size="15" letter-spacing="3" font-weight="600">••••  ••••  ••••  5566</text>
    <!-- Decorative circles -->
    <circle cx="280" cy="140" r="35" fill="rgba(255,255,255,0.08)"/>
    <circle cx="290" cy="150" r="25" fill="rgba(255,255,255,0.05)"/>
  </g>

  <!-- White Card (middle) -->
  <g transform="rotate(5, 270, 105)">
    <rect x="135" y="18" width="260" height="170" rx="14" fill="#f0f2f5" stroke="#d0d4da" stroke-width="2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.1))"/>
    <rect x="135" y="18" width="260" height="170" rx="14" fill="url(#goldShine)" opacity="0.5"/>
    <!-- Chip -->
    <rect x="160" y="50" width="36" height="28" rx="4" fill="rgba(180,180,180,0.25)"/>
    <rect x="163" y="53" width="30" height="22" rx="2" fill="rgba(180,180,180,0.12)"/>
    <!-- Card number -->
    <text x="160" y="115" fill="#4a4a5a" font-family="monospace" font-size="15" letter-spacing="3" font-weight="600">••••  ••••  ••••  1122</text>
    <!-- Expiry -->
    <text x="160" y="148" fill="#8a8a9a" font-family="sans-serif" font-size="8" letter-spacing="1">VALID THRU</text>
    <text x="160" y="162" fill="#4a4a5a" font-family="monospace" font-size="12" letter-spacing="2">09/26</text>
    <!-- Decorative circles -->
    <circle cx="365" cy="140" r="35" fill="rgba(200,200,200,0.15)"/>
  </g>

  <!-- Main Red Card -->
  <rect x="60" y="50" width="280" height="180" rx="16" fill="url(#cardGrad)" filter="drop-shadow(0 8px 24px rgba(100,0,0,0.4))"/>

  <!-- Card chip -->
  <rect x="85" y="95" width="40" height="32" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="88" y="98" width="34" height="26" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- Contactless icon -->
  <g transform="translate(155, 95)">
    <path d="M0 16 C4 12 4 8 0 4" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M6 20 C12 14 12 6 6 0" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Card circles decoration -->
  <circle cx="310" cy="170" r="45" fill="rgba(255,255,255,0.08)"/>
  <circle cx="325" cy="185" r="35" fill="rgba(255,255,255,0.06)"/>

  <!-- Card number -->
  <text x="85" y="160" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="18" letter-spacing="3" font-weight="600">••••  ••••  ••••  8842</text>

  <!-- Expiry -->
  <text x="85" y="195" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="9" letter-spacing="1">VALID THRU</text>
  <text x="85" y="212" fill="rgba(255,255,255,0.85)" font-family="monospace" font-size="14" letter-spacing="2">12/28</text>

  <!-- CVV -->
  <rect x="210" y="190" width="50" height="26" rx="3" fill="rgba(255,255,255,0.15)"/>
  <text x="222" y="207" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10" letter-spacing="1">CVV</text>

  <!-- Coins floating -->
  <circle cx="340" cy="80" r="14" fill="#ffd700" stroke="#daa520" stroke-width="1.5"/>
  <text x="340" y="84" fill="#b8860b" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="700">$</text>

  <circle cx="30" cy="200" r="10" fill="#ffd700" stroke="#daa520" stroke-width="1.5"/>
  <text x="30" y="204" fill="#b8860b" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">$</text>

  <!-- Secure lock icon -->
  <g transform="translate(340, 250)">
    <rect x="-8" y="-5" width="16" height="14" rx="3" fill="rgba(255,255,255,0.6)"/>
    <path d="M-4 -5 L-4 -9 C-4 -13 4 -13 4 -9 L4 -5" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none"/>
    <circle cx="0" cy="1" r="1.5" fill="#fff"/>
  </g>

  <!-- Decorative payment icons -->
  <g transform="translate(50, 270)">
    <rect x="-12" y="-12" width="24" height="24" rx="6" fill="rgba(255,255,255,0.15)"/>
    <path d="M-5 -2 L0 3 L5 -3" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(350, 270)">
    <rect x="-12" y="-12" width="24" height="24" rx="6" fill="rgba(255,255,255,0.15)"/>
    <path d="M-5 -2 L0 3 L5 -3" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Dots decoration -->
  <circle cx="40" cy="30" r="2" fill="rgba(255,255,255,0.12)"/>
  <circle cx="60" cy="18" r="1.5" fill="rgba(255,255,255,0.1)"/>
  <circle cx="360" cy="40" r="2" fill="rgba(255,255,255,0.12)"/>
  <circle cx="380" cy="25" r="1.5" fill="rgba(255,255,255,0.1)"/>
</svg>
